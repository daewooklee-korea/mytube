 $('group').textContent=q.gen+'세대 · '+category;$('question').textContent=q.question;
 $('progress').textContent='문제 '+(step+1)+' / '+round.length;renderScore();
 $('bar').style.width=((step+1)/round.length*100)+'%';
 for(const id of ['feedback','next','reward','credits'])$(id).hidden=true;
 renderPhoto(q);
 $('options').replaceChildren();
 shuffle([q.answer,...q.wrong]).forEach((name,i)=>{
  const button=document.createElement('button');button.className='choice';button.dataset.name=name;button.disabled=Boolean(q.photo)&&!photoReady;
  const letter=document.createElement('span');letter.textContent='ABCD'[i];letter.setAttribute('aria-hidden','true');
  button.append(letter,document.createTextNode(name));
  button.onclick=()=>choose(name);$('options').append(button);
 });
 if(focus)$('question').focus();
}
function sourceLink(label,url){
 const link=document.createElement('a');link.className='source';link.href=url;link.target='_blank';link.rel='noopener noreferrer';link.textContent=label;
 return link;
}
function showCredits(q){
 if(!q.source)return;
 const credit=q.photo?'사진 원본 · '+q.author:'가사 출처';
 $('credits').replaceChildren(sourceLink(credit,q.source));
 if(q.photo){
  const code=q.shareAlike?'by-sa':'by';
  $('credits').append(document.createTextNode(' · '),sourceLink('CC '+code.toUpperCase()+' '+q.license,'https://creativecommons.org/licenses/'+code+'/'+q.license+'/'));
 }
 $('credits').hidden=false;
}
function renderPhoto(q){
 clearTimeout(photoTimer);photoReady=!q.photo;
 $('photoBox').hidden=!q.photo;$('portrait').replaceChildren();
 if(!q.photo)return;
 $('skipPhoto').hidden=false;$('photoStatus').textContent='사진 불러오는 중…';
 const image=document.createElement('img');image.className='portrait';image.alt='퀴즈 속 아이돌 멤버 사진';image.hidden=true;
 $('portrait').append(image);
 const failed=()=>{
  if($('portrait').firstChild!==image||answered||photoReady)return;
  clearTimeout(photoTimer);$('photoStatus').textContent='사진을 불러오지 못했어요. 이 문제는 점수에 반영하지 않고 건너뛸 수 있어요.';
 };
 image.onerror=failed;
 image.onload=()=>{
  if($('portrait').firstChild!==image||answered)return;
  clearTimeout(photoTimer);photoReady=true;image.hidden=false;$('photoStatus').textContent='';
  for(const button of $('options').children)button.disabled=false;
 };
 photoTimer=setTimeout(failed,8000);
 image.src=q.photo;
}
function choose(name){
 if(answered||view!=='game'||!photoReady)return;
 answered=true;
 const q=round[step],correct=name===q.answer;
 for(const button of $('options').children){
  button.disabled=true;
  if(button.dataset.name===q.answer)button.classList.add('right');
  else if(button.dataset.name===name)button.classList.add('wrong');
 }
 const reward=q.reward??q;
 const label=activeMode==='lyrics'?reward.group+' 〈'+q.answer+'〉':reward.type==='group'?q.answer:reward.group+' '+q.answer;
 if(q.photo)$('skipPhoto').hidden=true;
 showCredits(q);
 $('feedback').textContent=correct?'정답! '+label+(owned.has(reward.id)?' 카드는 이미 수집했어요.':' 카드를 발견했어요.'):'정답은 '+label+'입니다.';
 $('feedback').hidden=false;
 if(correct){
  score++;renderScore();
  if(!owned.has(reward.id)){
   owned.add(reward.id);
   try{localStorage.setItem(key,JSON.stringify([...owned]));}catch{$('feedback').textContent+=' 이번 플레이에 카드가 기록됐어요.';}
   $('rewardCard').replaceChildren(card(reward,true));$('reward').hidden=false;
   $('toggle').textContent='수집함 '+owned.size+'/'+quiz.length;
  }
  try{navigator.vibrate?.(25);}catch{}
 }
 $('next').textContent=step+1===round.length?'결과 보기 →':'다음 문제 →';$('next').hidden=false;
 $('next').scrollIntoView({block:'nearest'});
}
function openAlbum(){previous=view;switchView('album');}
$('toggle').onclick=()=>{
 if(view==='groupAlbum')switchView('album');
 else if(view==='album')switchView(previous);
 else openAlbum();
};
$('backToGroups').onclick=()=>switchView('album');
$('viewCards').onclick=openAlbum;
$('skipPhoto').onclick=()=>{
 if(view!=='game'||answered||!round[step].photo)return;
 answered=true;skipped++;advance();
};
function advance(){
 if(!answered||view!=='game')return;
 clearTimeout(photoTimer);
 step++;
 if(step<round.length){renderQuestion(true);return;}
 const counted=round.length-skipped;
 $('resultTitle').textContent=counted?counted+'문제 중 '+score+'개 정답':'채점한 문제가 없어요';
 $('resultDetail').textContent='카드 '+owned.size+' / '+quiz.length+'장을 모았어요.'+(skipped?' 사진 '+skipped+'문제 건너뜀.':'')+(activeMode==='standard'?' 다음 판에서는 아직 모으지 못한 카드의 문제가 먼저 나와요.':'');
 switchView('result');
}
$('next').onclick=advance;
function prioritized(pool){
 return [...shuffle(pool.filter(q=>!owned.has(q.id))),...shuffle(pool.filter(q=>owned.has(q.id)))];
}
function makeRound(selected,mode){
 if(mode==='lyrics')return shuffle(lyricsQuiz.filter(q=>selected.includes(q.gen)));
 if(mode==='photo')return makePhotoRound(selected);
 const queues=shuffle(selected).map(gen=>({
  group:prioritized(groupQuiz.filter(q=>q.gen===gen)),
  member:prioritized(memberQuiz.filter(q=>q.gen===gen))
 }));
 const questions=[];
 for(let i=0;i<8;i++){
  const queue=queues[i%queues.length];
  const preferred=i<2?'group':'member';
  const fallback=preferred==='group'?'member':'group';
  questions.push(queue[preferred].shift()??queue[fallback].shift());
 }
 return shuffle(questions);
}
function makePhotoRound(selected){
 const queues=shuffle(selected).map(gen=>shuffle(photoQuiz.filter(q=>q.gen===gen))
  .sort((a,b)=>(photoAppearances.get(a.photo)??0)-(photoAppearances.get(b.photo)??0)));
 const questions=[];
 while(questions.length<photoRoundLimit&&queues.some(queue=>queue.length)){
  for(const queue of queues){
   if(!queue.length||questions.length===photoRoundLimit)continue;
   questions.push(queue.shift());
  }
 }
 for(const q of questions)photoAppearances.set(q.photo,(photoAppearances.get(q.photo)??0)+1);
 return shuffle(questions);
}
function start(selected,mode){
 if(!selected.length)return;
 activeGenerations=[...selected];activeMode=mode;round=makeRound(activeGenerations,activeMode);
 $('roundMode').textContent=modes[activeMode]+' · '+modeLabel(activeGenerations);
 step=0;score=0;skipped=0;switchView('game',false);renderQuestion(true);
}
$('replay').onclick=()=>start(activeGenerations,activeMode);
$('start').onclick=()=>start(selection(),$('mode').value);
updateSelection();
switchView('setup',false);
</script></body></html>
